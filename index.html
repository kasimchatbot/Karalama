<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KasımChat</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#212121;color:white;height:100vh;display:flex;flex-direction:column}
header{height:60px;padding:0 18px;display:flex;align-items:center;border-bottom:1px solid #444;font-size:20px;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:20px 15px 100px}
.msg{max-width:850px;margin:0 auto 22px;padding:15px;border-radius:12px;line-height:1.5;white-space:pre-wrap}
.user{background:#343541}
.bot{background:#2b2b2b}
.name{font-weight:bold;margin-bottom:7px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#212121;padding:12px}
.box{max-width:850px;margin:auto;display:flex;gap:8px;background:#2f2f2f;border:1px solid #555;border-radius:15px;padding:8px}
input{flex:1;background:transparent;border:0;outline:0;color:white;font-size:16px;padding:10px}
button{border:0;border-radius:10px;background:#10a37f;color:white;padding:0 18px;font-size:16px}
</style>
</head>

<body>

<header>✦ KasımChat</header>

<div id="chat">
<div class="msg bot">
<div class="name">KasımChat</div>
Merhaba! 👋 Ben KasımChat. Bana bir şey sor!
</div>
</div>

<div class="bottom">
<div class="box">
<input id="input" placeholder="Mesajını yaz..." autocomplete="off">
<button onclick="send()">➤</button>
</div>
</div>

<script>
const input=document.getElementById("input");
const chat=document.getElementById("chat");

function addMessage(name,text,type){
 const div=document.createElement("div");
 div.className="msg "+type;

 const nameDiv=document.createElement("div");
 nameDiv.className="name";
 nameDiv.textContent=name;

 const textDiv=document.createElement("div");
 textDiv.textContent=text;

 div.appendChild(nameDiv);
 div.appendChild(textDiv);
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

async function send(){
 const text=input.value.trim();
 if(!text)return;

 addMessage("Sen",text,"user");
 input.value="";

 addMessage("KasımChat","Düşünüyorum...","bot");
 const loading=chat.lastElementChild;

 try{
   const res=await fetch("/api/chat",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({message:text})
   });

   const data=await res.json();

   loading.remove();
   addMessage("KasımChat",data.reply || "Bir hata oluştu.","bot");

 }catch(error){
   loading.remove();
   addMessage("KasımChat","AI bağlantısı kurulamadı. Worker ayarlarını kontrol et.","bot");
 }
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")send();
});
</script
